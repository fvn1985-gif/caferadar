name: Atualizar CafeRadar na Nuvem (Portal & Cotações)

on:
  schedule:
    # Horários em UTC (Brasília = UTC - 3)
    # 13:30 UTC = 10h30 Brasília (Abertura B3 / Primeiros Negócios, Seg a Sex)
    - cron: '30 13 * * 1-5'
    # 16:00 UTC = 13h00 Brasília (Atualização de Almoço, Seg a Sex)
    - cron: '0 16 * * 1-5'
    # 21:15 UTC = 18h15 Brasília (Fechamento B3 consolidado, Seg a Sex)
    - cron: '15 21 * * 1-5'

  # Permite executar manualmente pelo site ou app do GitHub a qualquer momento
  workflow_dispatch:
    inputs:
      edicao:
        description: 'Escolha a edição para atualizar no portal'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - abertura
          - negocios
          - fechamento

permissions:
  contents: write

concurrency:
  group: atualizar-radar-prod
  cancel-in-progress: false

jobs:
  atualizar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar fontes do sistema (Linux)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: Instalar bibliotecas de mercado e imagem
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Robô de Cotações em Tempo Real
        env:
          EDICAO_INPUT: ${{ github.event.inputs.edicao || 'auto' }}
        run: |
          python scripts/atualizar_nuvem.py "$EDICAO_INPUT"

      - name: Gerar Cards PNG do Portal (Sem Telegram)
        env:
          EDICAO_INPUT: ${{ github.event.inputs.edicao || 'auto' }}
        run: |
          python scripts/executar_marketing_nuvem.py "$EDICAO_INPUT"

      - name: Atualizar Acervo, Sitemap, RSS e Fita HTML Estática
        run: |
          python scripts/gerar_acervo.py
          python scripts/gerar_acervo.py
          python scripts/gerar_rss_feed.py
          python scripts/sincronizar_portal_estatico.py

      - name: Publicar atualizações no caferadar.com.br
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || (git commit -m "Robô Nuvem: Radar, Imagens e Portal atualizados automaticamente [skip ci]" && git push)
