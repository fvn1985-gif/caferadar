name: Atualizar CafeRadar na Nuvem (Portal & Cotações)

on:
  schedule:
    # Horários em UTC (Brasília = UTC - 3)
    # 13:30 UTC = 10h30 Brasília (Abertura B3 / Primeiros Negócios, Seg a Sex)
    - cron: '30 13 * * 1-5'
    # 16:00 UTC = 13h00 Brasília (Atualização de Almoço, Seg a Sex)
    - cron: '0 16 * * 1-5'
    # 21:15 UTC = 18h15 Brasília (Fechamento B3 consolidado, Seg a Sex)
    - cron: '15 21 * * 1-5'

  # Permite executar manualmente pelo site ou app do GitHub a qualquer momento
  workflow_dispatch:
    inputs:
      edicao:
        description: 'Escolha a edição para atualizar no portal'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - abertura
          - negocios
          - fechamento

permissions:
  contents: write

jobs:
  atualizar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar bibliotecas de mercado
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas

      - name: Executar Robô de Cotações em Tempo Real
        run: |
          python scripts/atualizar_nuvem.py ${{ github.event.inputs.edicao || 'auto' }}

      - name: Publicar atualizações no caferadar.com.br
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || (git commit -m "Robô Nuvem: Radar e Dados atualizados automaticamente [skip ci]" && git push)
