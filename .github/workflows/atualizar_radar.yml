name: Atualizar CafeRadar na Nuvem (3 Edicoes Diarias)

on:
  schedule:
    # Horários em UTC (Brasília = UTC - 3)
    # 11:30 UTC = 08h30 Brasília (Edição Abertura, Seg a Sex)
    - cron: '30 11 * * 1-5'
    # 15:30 UTC = 12h30 Brasília (Edição Almoço, Seg a Sex)
    - cron: '30 15 * * 1-5'
    # 21:30 UTC = 18h30 Brasília (Edição Fechamento, Seg a Sex)
    - cron: '30 21 * * 1-5'

  # Permite executar manualmente pelo site ou app do GitHub a qualquer momento
  workflow_dispatch:
    inputs:
      edicao:
        description: 'Escolha a edição para atualizar'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - abertura
          - almoco
          - fechamento

permissions:
  contents: write

jobs:
  atualizar-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar bibliotecas de mercado
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Executar Robô de Cotações em Tempo Real
        run: |
          python scripts/atualizar_nuvem.py ${{ github.event.inputs.edicao || 'auto' }}

      - name: Publicar atualizações no caferadar.com.br
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --staged --quiet || (git commit -m "Robô Nuvem: Radar de Mercado atualizado automaticamente" && git push)
